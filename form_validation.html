<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>
<body>
    <script>
        function data(){
        var a=document.getElementById("n1").value;
        var b=document.getElementById("n2").value;
        var c=document.getElementById("n3").value;
        var d=document.getElementById("n4").value;

        // if any field is empty it should show error!
        if(a==""|| b=="" || c=="" || d=="" ){
            alert("All fields are Mendatory");
            return false;

        }
        //no. should be 10 digits
        else if(b.length<10 || b.length>10 ){
            alert("Number Should be 10 digits!");
            return false;

        }
        //only digits are allowed not alphabet or special character!
            else if(isNaN(b) ){
            alert("Only Number are allowed!");
            return false;

        }
        //for same password
         else if(c!=d){
            alert("Please enter same password!");
            return false;

        }
        else{
              true;
        }
    }
    </script>
    <form onSubmit=" return data()" action = "next.html">
        UserId:          <input type="text" id="n1"><br><br>
        Contact:         <input type="text" id="n2"><br><br>
        Password:        <input type="password" id="n3"><br><br>
        Confirm Password:<input type="password" id="n4"><br><br>
        <input type="Submit" value="Submit">
    </form>
    
</body>
</html>
